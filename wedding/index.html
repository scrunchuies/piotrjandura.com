<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cecylia &amp; Gregory — May 15, 2027</title>
    <meta
      name="description"
      content="Cecylia Jandura and Gregory Rau are getting married on May 15, 2027 in Florham Park, NJ. Schedule, travel, FAQ, and RSVP."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cecylia &amp; Gregory — May 15, 2027" />
    <meta
      property="og:description"
      content="Cecylia Jandura and Gregory Rau are getting married on May 15, 2027 in Florham Park, NJ."
    />
    <meta property="og:image" content="https://wedding.piotrjandura.com/images/hero-couple.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Marcellus&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="site.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="./">Cecylia &amp; Gregory</a>
      <nav class="site-nav" aria-label="Main">
        <a href="./" aria-current="page">Home</a>
        <a href="schedule/">Schedule</a>
        <a href="travel/">Travel</a>
        <a href="faq/">FAQ</a>
        <a href="rsvp/">RSVP</a>
      </nav>
    </header>

    <main>
      <section class="hero-split" aria-label="Photos of Cecylia and Gregory">
        <div class="hero-main" data-carousel>
          <div class="carousel-track">
            <img
              class="is-active"
              src="images/carousel-1.jpg"
              alt="Cecylia and Gregory smiling together on a rocky shoreline"
              width="1024"
              height="656"
              fetchpriority="high"
            />
            <img
              src="images/carousel-2.jpg"
              alt="Cecylia resting her head on Gregory's shoulder by the water"
              width="991"
              height="627"
            />
            <img
              src="images/carousel-3.jpg"
              alt="Cecylia and Gregory standing face to face on granite rocks above the sea"
              width="1024"
              height="682"
            />
            <img
              src="images/carousel-4.jpg"
              alt="Gregory on one knee proposing to Cecylia on the rocks by the ocean"
              width="1024"
              height="682"
            />
          </div>
          <div class="monogram" aria-hidden="true">
            <span class="mono-c">C</span>
            <span class="mono-amp">&amp;</span>
            <span class="mono-g">G</span>
          </div>
          <button class="carousel-btn carousel-prev" type="button" aria-label="Previous photo">
            <span aria-hidden="true">‹</span>
          </button>
          <button class="carousel-btn carousel-next" type="button" aria-label="Next photo">
            <span aria-hidden="true">›</span>
          </button>
          <div class="carousel-dots" role="tablist" aria-label="Choose a photo"></div>
        </div>
      </section>

      <section class="section home-intro">
        <h1 class="couple-names">
          <span class="script script-ink name">Cecylia Jandura</span>
          <span class="and">and</span>
          <span class="script script-ink name">Gregory Rau</span>
        </h1>

        <div class="when-where">
          <div>
            <p class="script script-md script-ink">Florham Park</p>
            <p class="label">NJ</p>
          </div>
          <div>
            <p class="script script-md script-ink">
              <time datetime="2027-05-15T15:00:00-04:00">May 15</time>
            </p>
            <p class="label">2027</p>
          </div>
        </div>

        <p class="countdown" data-countdown>
          <noscript>Saturday, May 15, 2027 at 3:00 pm</noscript>
        </p>

        <a class="button button-sage button-wide" href="rsvp/">RSVP</a>
      </section>

      <section class="section welcome" aria-labelledby="welcome-title">
        <h2 class="script script-sm echo" id="welcome-title">Welcome!</h2>
        <div class="welcome-photos">
          <img
            class="welcome-kiss"
            src="images/welcome-kiss.jpg"
            alt="Gregory kissing Cecylia on the forehead while she laughs"
            width="978"
            height="652"
            loading="lazy"
          />
          <img
            class="welcome-hands"
            src="images/welcome-hands.jpg"
            alt="Close-up of Cecylia and Gregory holding hands, showing the engagement ring"
            width="652"
            height="435"
            loading="lazy"
          />
        </div>
      </section>

      <div class="bleed">
        <img
          src="images/waves-wide.jpg"
          alt="Cecylia and Gregory embracing on the rocks as waves crash behind them"
          width="1086"
          height="724"
          loading="lazy"
        />
      </div>
    </main>

    <footer class="site-footer">
      <p class="script">Cecylia &amp; Gregory</p>
      <p>Saturday, May 15, 2027 · Florham Park, NJ · <a href="rsvp/">RSVP</a></p>
    </footer>
  </body>
</html>
